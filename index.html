<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Quick Log</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1c1c21;
      --border: #2e2e38;
      --accent: #3b82f6;
      --accent-active: #2563eb;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app { width: 100%; max-width: 520px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { font-size: 1.3rem; margin: 0; font-weight: 700; }
    .btn-icon { background: #262630; border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 0.95rem; }
    textarea {
      width: 100%;
      height: 240px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      color: #fff;
      font-size: 1.15rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      margin-bottom: 8px;
    }
    textarea:focus { border-color: var(--accent); }
    .bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
    .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 14px; }
    .btn {
      padding: 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.05rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-mic { background: #272732; border: 1px solid var(--border); color: #fff; }
    .btn-mic.recording { background: var(--danger); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:active { background: var(--accent-active); }
    .status { text-align: center; min-height: 24px; font-size: 0.85rem; color: var(--accent); }
    .drawer { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; display: none; }
    .drawer.open { display: block; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .field input { width: 100%; padding: 10px; background: #121214; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 1rem; }
    .log-entry { background: #121214; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 0.9rem; }
    .log-time { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>⚡ Quick Log</h1>
    <div>
      <button class="btn-icon" onclick="toggleView('history')">📜 History</button>
      <button class="btn-icon" onclick="toggleView('settings')">⚙️</button>
    </div>
  </div>

  <div id="settings" class="drawer">
    <div class="field">
      <label>Destination Email:</label>
      <input type="email" id="targetEmail" placeholder="your-email@example.com" />
    </div>
    <div class="field">
      <label>Subject Prefix:</label>
      <input type="text" id="prefix" value="[Quick Log]" />
    </div>
    <button class="btn btn-primary" style="width:100%; padding:10px;" onclick="saveConfig()">Save Settings</button>
  </div>

  <div id="history" class="drawer">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong style="font-size:0.9rem;">Recent Dispatches</strong>
      <button class="btn-icon" style="padding:4px 8px; font-size:0.75rem;" onclick="clearHistory()">Clear</button>
    </div>
    <div id="historyList" style="margin-top:8px;"></div>
  </div>

  <textarea id="noteInput" placeholder="Type or dictate a note..."></textarea>

  <div class="bar">
    <span id="wordCount">0 words</span>
    <button class="btn-icon" style="padding:4px 8px; font-size:0.8rem;" onclick="clearNote()">Clear Text</button>
  </div>

  <div class="actions">
    <button id="micBtn" class="btn btn-mic" onclick="toggleMic()">🎙️ Dictate</button>
    <button class="btn btn-primary" onclick="sendNote()">✉️ Send to Email</button>
  </div>

  <div id="statusMsg" class="status"></div>
</div>

<script>
  const input = document.getElementById('noteInput');
  const count = document.getElementById('wordCount');
  const status = document.getElementById('statusMsg');
  const micBtn = document.getElementById('micBtn');
  const emailInput = document.getElementById('targetEmail');
  const prefixInput = document.getElementById('prefix');

  emailInput.value = localStorage.getItem('ql_email') || '';
  prefixInput.value = localStorage.getItem('ql_prefix') || '[Quick Log]';

  input.addEventListener('input', () => {
    const words = input.value.trim() ? input.value.trim().split(/\s+/).length : 0;
    count.textContent = words + ' word' + (words === 1 ? '' : 's');
  });

  let rec = null, isRecording = false;
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (Speech) {
    rec = new Speech();
    rec.continuous = true;
    rec.interimResults = true;
    rec.onstart = () => { isRecording = true; micBtn.classList.add('recording'); micBtn.innerHTML = '🛑 Stop'; status.textContent = 'Listening...'; };
    rec.onresult = (e) => {
      let t = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) t += e.results[i][0].transcript + ' ';
      }
      if (t) {
        input.value += (input.value && !input.value.endsWith(' ') ? ' ' : '') + t;
        input.dispatchEvent(new Event('input'));
      }
    };
    rec.onerror = rec.onend = () => {
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = '🎙️ Dictate';
      status.textContent = '';
    };
  } else {
    micBtn.style.display = 'none';
  }

  function toggleMic() {
    if (!rec) return;
    if (isRecording) rec.stop();
    else rec.start();
  }

  function toggleView(id) {
    const target = document.getElementById(id);
    const other = id === 'settings' ? document.getElementById('history') : document.getElementById('settings');
    other.classList.remove('open');
    target.classList.toggle('open');
    if (id === 'history' && target.classList.contains('open')) renderHistory();
  }

  function saveConfig() {
    localStorage.setItem('ql_email', emailInput.value.trim());
    localStorage.setItem('ql_prefix', prefixInput.value.trim());
    status.textContent = 'Settings saved!';
    setTimeout(() => { status.textContent = ''; document.getElementById('settings').classList.remove('open'); }, 900);
  }

  function clearNote() {
    input.value = '';
    input.dispatchEvent(new Event('input'));
  }

  function sendNote() {
    const text = input.value.trim();
    if (!text) { status.textContent = 'Enter or dictate a note first.'; return; }
    const email = localStorage.getItem('ql_email');
    if (!email) {
      document.getElementById('settings').classList.add('open');
      status.textContent = 'Set your email address first.';
      return;
    }
    const prefix = localStorage.getItem('ql_prefix') || '[Quick Log]';
    const subj = prefix + ' ' + text.slice(0, 28).replace(/[\n\r]+/g, ' ') + '...';

    let history = JSON.parse(localStorage.getItem('ql_history') || '[]');
    history.unshift({ text, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
    if (history.length > 10) history.pop();
    localStorage.setItem('ql_history', JSON.stringify(history));

    window.location.href = 'mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(text);
    setTimeout(() => { input.value = ''; input.dispatchEvent(new Event('input')); }, 500);
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    const history = JSON.parse(localStorage.getItem('ql_history') || '[]');
    list.innerHTML = history.length ? history.map(h => `<div class="log-entry"><div class="log-time">${h.time}</div><div>${h.text}</div></div>`).join('') : '<div style="color:var(--muted);font-size:0.8rem;">No logs yet.</div>';
  }

  function clearHistory() {
    localStorage.removeItem('ql_history');
    renderHistory();
  }
</script>
</body>
</html>
